[build]
  publish = "."

# DEV BRANCH ONLY — keep this preview site out of search engines entirely.
# X-Robots-Tag (not robots.txt) is deliberate: a robots.txt Disallow would stop
# Google from crawling but the URL could still appear in results; noindex
# de-indexes, and crawlers must be able to fetch the page to see it. The site
# stays reachable by direct URL. Do NOT let this block spread to main's
# netlify.toml during main→dev merges (same siloing rule as GA4, in reverse).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively, never cache HTML
[[headers]]
  for = "/src/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/src/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/src/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Clean URL redirects (so /menu works in addition to /pages/menu.html)
[[redirects]]
  from = "/menu"
  to = "/pages/menu.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/pages/gallery.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/pages/shop.html"
  status = 200

[[redirects]]
  from = "/careers"
  to = "/pages/careers.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200

[[redirects]]
  from = "/reservations"
  to = "/pages/reservations.html"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
