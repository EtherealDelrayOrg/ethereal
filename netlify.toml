[build]
  publish = "."

# Cache static assets aggressively, never cache HTML
[[headers]]
  for = "/src/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ...except the menu. The rule above marks assets immutable for a year, which is
# right for images and the opening video (they get replaced under new filenames)
# but wrong for a menu: the restaurant will re-issue it at the SAME path, and
# `immutable` tells browsers not to even revalidate — returning visitors would
# keep seeing the old menu for up to a year. Declared after the broader rule so
# it wins for this path.
[[headers]]
  for = "/src/assets/menu/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/src/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/src/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Clean URL redirects (so /menu works in addition to /pages/menu.html)
[[redirects]]
  from = "/menu"
  to = "/pages/menu.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/pages/gallery.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/pages/shop.html"
  status = 200

[[redirects]]
  from = "/careers"
  to = "/pages/careers.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200

[[redirects]]
  from = "/reservations"
  to = "/pages/reservations.html"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
