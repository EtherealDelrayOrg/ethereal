        <div class="reveal" style="text-align:center;">
          <!-- Opens the Resy booking modal in place (main.js, [data-resy-book])
               rather than sending the visitor off to the reservations page. The
               href is the real venue link, used as the fallback when the widget
               can't open — see the handler for why that matters on mobile. -->
          <a href="https://resy.com/cities/delray-beach-fl/venues/ethereal" class="btn" data-resy-book>Reserve Your Experience</a>
        </div>

  </main>

  <site-footer></site-footer>

  <!-- Lightbox: built once here rather than injected, so it needs no JS to exist in
       the DOM and screen readers see a real dialog. Hidden until opened. -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
    <button class="lightbox-close" type="button" aria-label="Close viewer">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photograph">&#8249;</button>
    <figure class="lightbox-figure">
      <!-- No src attribute until a photo is chosen: an empty src= makes the
           browser re-request the current page as an image. -->
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photograph">&#8250;</button>
  </div>
