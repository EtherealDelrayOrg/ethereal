<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PLACEHOLDER: the "Where time breathes." tagline was retired at client request and
       its replacement isn't set yet. Title and description are deliberately left clean
       rather than carrying a [ bracket ] placeholder — unlike on-page copy, these two
       are what Google prints in search results and what shows in the browser tab, so a
       visible TODO here would be public. Drop the new tagline into both when it lands:
       <title>Ethereal — [ New Tagline ]</title> -->
  <meta name="description" content="Ethereal — A fine dining restaurant in Delray Beach, FL. Reservations, menu, and more.">
  <title>Ethereal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/src/assets/images/favicon-clock.png">
  <meta name="theme-color" content="#0d0b09">
  <link rel="stylesheet" href="/src/css/globals.css">
  <link rel="stylesheet" href="/src/css/opening-sequence.css">
  <link rel="stylesheet" href="/src/css/home.css">
  <noscript><style>#opening-sequence,.seq-bloom,#seq-fog{display:none!important}#site-content{opacity:1!important}#site-header{opacity:1!important;pointer-events:auto!important}.hero-label,.hero-title,.hero-sub,.hero-ctas{opacity:1!important;animation:none!important}.hero-bg{transform:scale(1.04)!important}</style></noscript>
  <script src="/src/js/partials.js"></script>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ── Opening Sequence ─────────────────────────────── -->
  <div id="opening-sequence" role="presentation" aria-hidden="true">

    <!-- Full-bleed AI video — desktop/mobile source and poster picked and set
         by opening-sequence.js (matchMedia), which also plays it. -->
    <video id="opening-video" muted playsinline webkit-playsinline
           preload="auto" aria-hidden="true"></video>

    <!-- Static clock fallback — only shown if autoplay gets blocked or the
         clip fails to load, on either viewport size -->
    <div class="seq-clock" id="seq-clock-fallback">
      <img src="/src/assets/images/clock-face-transparent.png" alt="" aria-hidden="true">
    </div>

    <div class="seq-brand">
      <!-- PLACEHOLDER: retired tagline, replacement TBD. Left empty rather than
           carrying [ bracket ] text because this line renders over the opening
           screen on the fallback path (autoplay blocked / clip failed), where a
           visible TODO would be the first thing a visitor sees. -->
      <span class="seq-tagline"></span>
    </div>

    <button class="seq-skip" aria-label="Skip opening sequence">Skip</button>

    <div class="seq-progress" role="progressbar" aria-label="Loading" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="seq-progress-fill"></div>
    </div>

  </div>
  <!-- /Opening Sequence -->

  <!-- Fog bridge: WebGL (Vanta.js FOG) drifting mist, pre-warmed hidden well before
       crossfade so there's no WebGL cold-start stutter at reveal — just fades in/out
       like the bloom below. Desktop only (see opening-sequence.js): skips the
       Three.js/WebGL weight entirely on mobile, which has no video to bridge from yet. -->
  <div id="seq-fog" aria-hidden="true"></div>

  <!-- Light-bloom bridge: swells at crossfade-start, dissolves over the blend
       (see opening-sequence.css). Removed from the DOM once the site is revealed. -->
  <div class="seq-bloom" id="seq-bloom" aria-hidden="true"></div>

  <!-- ── Site Content ──────────────────────────────────── -->
  <div id="site-content" aria-hidden="true">

    <!-- NAV -->
    <site-header opening></site-header>

    <!-- Mobile Nav Overlay -->

    <main id="main-content">

      <!-- ── Hero ─────────────────────────────────────── -->
      <section id="hero" aria-label="Ethereal">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-scrim" aria-hidden="true"></div>
        <div class="hero-content">
          <span class="hero-label">Coming Soon</span>
          <!-- Hero heading removed at client request (was "Where time breathes.").
               Deliberately left with no replacement copy for now. The .hero-title
               styles + entrance animation stay in home.css so restoring it is just
               putting the <h1 class="hero-title" id="hero-title"> back here (and
               switching the section above back to aria-labelledby="hero-title"). -->
          <div class="hero-ctas">
            <a href="/pages/reservations.html" class="btn btn--filled">Reserve a Table</a>
            <a href="/pages/menu.html" class="btn btn--ghost">View the Menu</a>
          </div>
        </div>
          <!-- Cocktail preview: one drink at a time rising out of fog at the foot
               of the hero, tinted to that drink's own colour. Sits inside #hero so
               it inherits the reveal, and is purely additive — no JS, no strip. -->
          <div class="hero-cocktails" id="hero-cocktails">
            <!-- Vanta writes position:relative inline on whatever element it mounts to,
                 which would override this layer's absolute positioning and collapse it
                 to 0x0 as a flex item. So it gets its own inner div to scribble on. -->
            <div class="cocktail-fog" aria-hidden="true"><div id="cocktail-fog"></div></div>
            <a class="cocktail-card" id="cocktail-card" href="/pages/menu.html"
               aria-label="See the full cocktail menu">
              <span class="cocktail-name" id="cocktail-name"></span>
              <img class="cocktail-img" id="cocktail-img" src="" alt=""
                   width="180" height="180" decoding="async">
            </a>
          </div>
      </section>

    </main>

    <!-- ── Footer ────────────────────────────────────── -->
    <site-footer></site-footer>

  </div>
  <!-- /site-content -->

  <script src="/src/js/opening-sequence.js"></script>
  <script src="/src/js/main.js"></script>
  <script src="/src/js/hero-cocktails.js"></script>
</body>
</html>
