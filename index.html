<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ethereal — A fine dining restaurant where time breathes. Reservations, menu, and more.">
  <title>Ethereal — Where Time Breathes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/src/assets/images/favicon-clock.png">
  <meta name="theme-color" content="#0d0b09">
  <link rel="stylesheet" href="/src/css/globals.css">
  <link rel="stylesheet" href="/src/css/opening-sequence.css">
  <link rel="stylesheet" href="/src/css/home.css">
  <noscript><style>#opening-sequence{display:none!important}#site-content{opacity:1!important}#site-header{opacity:1!important;pointer-events:auto!important}</style></noscript>
  <script src="/src/js/partials.js"></script>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ── Opening Sequence ─────────────────────────────── -->
  <div id="opening-sequence" role="presentation" aria-hidden="true">

    <!-- Real clock face — replaced by <video> when AI video is ready -->
    <div class="seq-clock">
      <img src="/src/assets/images/clock-face-transparent.png" alt="" aria-hidden="true">
    </div>

    <div class="seq-brand">
      <span class="seq-tagline">where time breathes.</span>
    </div>

    <button class="seq-skip" aria-label="Skip opening sequence">Skip</button>

    <div class="seq-progress" role="progressbar" aria-label="Loading" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="seq-progress-fill"></div>
    </div>

  </div>
  <!-- /Opening Sequence -->

  <!-- ── Site Content ──────────────────────────────────── -->
  <div id="site-content" aria-hidden="true">

    <!-- NAV -->
    <site-header opening></site-header>

    <!-- Mobile Nav Overlay -->

    <main id="main-content">

      <!-- ── Hero ─────────────────────────────────────── -->
      <section id="hero" aria-labelledby="hero-title">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-vignette" aria-hidden="true"></div>
        <div class="hero-content">
          <span class="hero-label">Coming Soon</span>
          <h1 class="hero-title" id="hero-title">Where time<br>breathes.</h1>
          <p class="hero-sub">An intimate dining experience shaped by the poetry of slow time.</p>
          <div class="hero-ctas">
            <a href="/pages/reservations.html" class="btn btn--filled">Reserve a Table</a>
            <a href="/pages/menu.html" class="btn btn--ghost">View the Menu</a>
          </div>
        </div>
      </section>

    </main>

    <!-- ── Footer ────────────────────────────────────── -->
    <site-footer></site-footer>

  </div>
  <!-- /site-content -->

  <script src="/src/js/opening-sequence.js"></script>
  <script src="/src/js/main.js"></script>
</body>
</html>
