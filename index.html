<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- No Google Analytics here, deliberately. GA4 is main-only: this is a
       preview branch and its traffic — ours, the client's, whoever we are
       showing it to — would land in the live property and skew real-visit
       numbers. If a main→dev merge brings the gtag.js snippet back, strip it
       again rather than "fixing" its absence. See INTEGRATIONS.md. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PLACEHOLDER: the "Where time breathes." tagline was retired at client request and
       its replacement isn't set yet. Title and description are deliberately left clean
       rather than carrying a [ bracket ] placeholder — unlike on-page copy, these two
       are what Google prints in search results and what shows in the browser tab, so a
       visible TODO here would be public. Drop the new tagline into both when it lands:
       <title>Ethereal — [ New Tagline ]</title> -->
  <meta name="description" content="Ethereal — A fine dining restaurant in Delray Beach, FL. Reservations, menu, and more.">
  <title>Ethereal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="canonical" href="https://etherealdelray.com/">
  <link rel="icon" type="image/png" href="/src/assets/images/favicon-clock.png">
  <meta name="theme-color" content="#0d0b09">
  <link rel="stylesheet" href="/src/css/globals.css?v=20260918a">
  <link rel="stylesheet" href="/src/css/opening-sequence.css?v=20260918a">
  <link rel="stylesheet" href="/src/css/home.css?v=20260918a">
  <noscript><style>#opening-sequence,.seq-bloom,#seq-fog{display:none!important}#site-content{opacity:1!important}#site-header{opacity:1!important;pointer-events:auto!important}.hero-label,.hero-title,.hero-sub,.hero-ctas{opacity:1!important;animation:none!important}.hero-bg{transform:scale(1.04)!important}</style></noscript>
  <script src="/src/js/partials.js?v=20260918a"></script>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ── Opening Sequence ─────────────────────────────── -->
  <div id="opening-sequence" role="presentation" aria-hidden="true">

    <!-- Full-bleed AI video — desktop/mobile source and poster picked and set
         by opening-sequence.js (matchMedia), which also plays it. -->
    <video id="opening-video" muted playsinline webkit-playsinline
           preload="auto" aria-hidden="true"></video>

    <!-- Static clock fallback — only shown if autoplay gets blocked or the
         clip fails to load, on either viewport size.

         data-src, not src: this path is the exception, not the rule, but a plain
         src makes every visitor download the image during preload — before any
         script can hide it — so the common (video) path was paying for an asset
         it never shows. opening-sequence.js promotes data-src to src at the
         moment the fallback is actually needed. -->
    <div class="seq-clock" id="seq-clock-fallback">
      <img data-src="/src/assets/images/clock-face-transparent.webp" alt="" aria-hidden="true">
    </div>

    <div class="seq-brand">
      <!-- PLACEHOLDER: retired tagline, replacement TBD. Left empty rather than
           carrying [ bracket ] text because this line renders over the opening
           screen on the fallback path (autoplay blocked / clip failed), where a
           visible TODO would be the first thing a visitor sees. -->
      <span class="seq-tagline"></span>
    </div>

    <button class="seq-skip" aria-label="Skip opening sequence">Skip</button>

    <div class="seq-progress" role="progressbar" aria-label="Loading" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="seq-progress-fill"></div>
    </div>

  </div>
  <!-- /Opening Sequence -->

  <!-- Fog bridge: WebGL (Vanta.js FOG) drifting mist, pre-warmed hidden well before
       crossfade so there's no WebGL cold-start stutter at reveal — just fades in/out
       like the bloom below. Desktop only (see opening-sequence.js): skips the
       Three.js/WebGL weight entirely on mobile, which has no video to bridge from yet. -->
  <div id="seq-fog" aria-hidden="true"></div>

  <!-- Light-bloom bridge: swells at crossfade-start, dissolves over the blend
       (see opening-sequence.css). Removed from the DOM once the site is revealed. -->
  <div class="seq-bloom" id="seq-bloom" aria-hidden="true"></div>

  <!-- ── Site Content ──────────────────────────────────── -->
  <div id="site-content" aria-hidden="true">

    <!-- NAV -->
    <site-header opening></site-header>

    <!-- Mobile Nav Overlay -->

    <main id="main-content">

      <!-- ── Hero ─────────────────────────────────────── -->
      <section id="hero" aria-label="Ethereal">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-scrim" aria-hidden="true"></div>
        <div class="hero-content">
          <!-- Hero heading removed at client request (was "Where time breathes.").
               Deliberately left with no replacement copy for now. The .hero-title
               styles + entrance animation stay in home.css so restoring it is just
               putting the <h1 class="hero-title" id="hero-title"> back here (and
               switching the section above back to aria-labelledby="hero-title"). -->
          <div class="hero-ctas">
            <a href="https://resy.com/cities/delray-beach-fl/venues/ethereal" class="btn btn--filled" data-resy-book>Reserve a Table</a>
            <!-- Opens the client's designed PDF menu rather than /menu,
                 which is still placeholder copy on this branch. New tab so the
                 visitor doesn't lose the site behind the PDF viewer. -->
            <a href="/src/assets/menu/ethereal-menu.pdf" class="btn btn--ghost" target="_blank" rel="noopener">View the Menu</a>
          </div>
        </div>
      </section>

      <!-- ── Signature Cocktails ──────────────────────────
           A separate block under the mural, not part of the hero. The whole
           thing is built by cocktail-rail.js and stays [hidden] until it has
           been, so no-JS gets nothing rather than an empty heading over an
           empty shelf. -->
      <!-- aria-label, not aria-labelledby: the visible heading was dropped at
           the client's request, but the landmark still needs a name for anyone
           moving through the page by region. -->
      <section id="cocktails" class="cocktails" aria-label="Signature cocktails" hidden>

        <div class="cocktail-stage reveal">
          <!-- aria-hidden: every slide is a link already labelled with its own
               drink, so announcing this too would repeat it on every scroll.
               The wrapper owns where the name sits; the name itself owns how it
               changes — two transforms that would otherwise overwrite each other. -->
          <div class="cocktail-caption" aria-hidden="true">
            <p class="cocktail-name" id="cocktail-name"></p>
          </div>
          <!-- light in the air behind the centred drink, in its own colour -->
          <div class="cocktail-pool" aria-hidden="true"></div>
          <!-- the bar the glasses stand on: a hairline with a pool of light
               on it, sitting behind the rail so the glasses cover it -->
          <div class="cocktail-bar" aria-hidden="true"></div>

          <button class="cocktail-arrow cocktail-arrow--prev" type="button" data-step="-1" aria-label="Previous cocktail">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <path d="M15 4 L7 12 L15 20"/>
            </svg>
          </button>
          <div class="cocktail-rail" id="cocktail-rail" role="group"
               aria-label="Signature cocktails — drag or swipe to browse"></div>
          <button class="cocktail-arrow cocktail-arrow--next" type="button" data-step="1" aria-label="Next cocktail">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <path d="M9 4 L17 12 L9 20"/>
            </svg>
          </button>
        </div>

      </section>

    </main>

    <!-- ── Footer ────────────────────────────────────── -->
    <site-footer></site-footer>

  </div>
  <!-- /site-content -->

  <script src="/src/js/opening-sequence.js?v=20260918a"></script>
  <script src="/src/js/main.js?v=20260918a"></script>
  <script src="/src/js/cocktail-rail.js?v=20260918a"></script>
</body>
</html>
