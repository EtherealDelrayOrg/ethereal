<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/src/assets/images/favicon-clock.png">
  <meta name="theme-color" content="#0d0b09">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Ethereal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/globals.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .not-found-number {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 300;
      font-style: italic;
      color: var(--brass-dark);
      line-height: 1;
      opacity: 0.4;
    }
    .not-found h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 300;
      font-style: italic;
      color: var(--ivory);
    }
    .not-found p {
      font-family: var(--font-display);
      font-style: italic;
      color: var(--ivory-dark);
      max-width: 380px;
    }
  </style>
</head>
<body>
  <main class="not-found" id="main-content">
    <div class="not-found-number" aria-hidden="true">404</div>
    <h1>This page has wandered off.</h1>
    <p>Time moves strangely here. The page you're looking for doesn't seem to exist.</p>
    <a href="/" class="btn" style="margin-top:0.5rem;">Return Home</a>
  </main>
</body>
</html>
