  <!-- ── CORNER GEAR ORNAMENTS ──
       Six spinning gears around the clock. JavaScript draws their
       SVG teeth at startup. Alternating spin directions make them
       look like a real meshed gear train.                         -->
  <!-- Corner small gears -->
  <div class="small-gear sg1"></div>
  <div class="small-gear sg2"></div>
  <div class="small-gear sg3"></div>
  <div class="small-gear sg4"></div>
  <div class="small-gear sg5"></div>
  <div class="small-gear sg6"></div>

  <!-- ── MAIN CLOCK ────────────────────────────────────────
       The entire clock lives in #clock-wrapper.
       Clicking it calls openClock() to start the sequence.  -->
  <!-- Main Clock -->
  <div id="clock-wrapper" onclick="openClock()">
    <div class="gear-ring gear-outer"></div>
    <div class="gear-ring gear-mid"></div>
    <div class="gear-ring gear-inner"></div>

    <!-- Three smoke blobs that drift upward from the top pipe. -->
    <!-- Steam puffs from top pipe -->
    <div class="steam-puff sp1"></div>
    <div class="steam-puff sp2"></div>
    <div class="steam-puff sp3"></div>

    <!-- Four decorative pipe stubs (top/bottom/left/right) with domed end-caps. -->
    <!-- Pipe connectors with end caps -->
    <div class="pipe pipe-top"></div>
    <div class="pipe pipe-bottom"></div>
    <div class="pipe pipe-left"></div>
    <div class="pipe pipe-right"></div>
    <div class="pipe-cap pipe-cap-top"></div>
    <div class="pipe-cap pipe-cap-bottom"></div>
    <div class="pipe-cap pipe-cap-left"></div>
    <div class="pipe-cap pipe-cap-right"></div>

    <!-- ── CLOCK FACE ──
         The dark circular face. Three transparent SVG layers stack inside:
           1. #clock-svg       — decorative face art drawn by JS
           2. #inner-gears-svg — hover-reveal gear system
           3. #hands-svg       — the three clock hands          -->
    <div id="clock-face">
      <!-- JS paints all face detail (rivets, rings, numerals, gauge) into this blank SVG. -->
      <svg id="clock-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- ── INNER GEAR SYSTEM ──
           Hidden until you hover the clock. Nine interlocking gears spin
           behind the face. Each <g> is a placeholder JS fills with
           tooth/spoke/rivet artwork. Fades out when you click.      -->
      <svg id="inner-gears-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"
           style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 0.5s ease;">
        <defs>
          <radialGradient id="gFill1" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#5a3a18"/>
            <stop offset="100%" stop-color="#2a1808"/>
          </radialGradient>
          <radialGradient id="gFill2" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#7a4a1e"/>
            <stop offset="100%" stop-color="#3a2010"/>
          </radialGradient>
          <radialGradient id="gFill3" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#4a3010"/>
            <stop offset="100%" stop-color="#1e1208"/>
          </radialGradient>
          <clipPath id="faceClipIG"><circle cx="250" cy="250" r="246"/></clipPath>
        </defs>
        <!-- all gears clipped to clock face circle -->
        <g clip-path="url(#faceClipIG)" id="inner-gear-group">

          <!-- GEAR A — large central bg gear, slow, 32 teeth, r=72 -->
          <g id="igA" style="transform-origin:250px 250px">
            <!-- built by JS -->
          </g>

          <!-- GEAR B — upper-left, meshed with A, 18 teeth, r=40 -->
          <g id="igB" style="transform-origin:178px 178px">
          </g>

          <!-- GEAR C — upper-right, meshed with A, 20 teeth, r=45 -->
          <g id="igC" style="transform-origin:330px 172px">
          </g>

          <!-- GEAR D — lower-left, meshed with A, 14 teeth, r=32 -->
          <g id="igD" style="transform-origin:172px 336px">
          </g>

          <!-- GEAR E — lower-right, meshed with A, 16 teeth, r=36 -->
          <g id="igE" style="transform-origin:336px 330px">
          </g>

          <!-- GEAR F — tiny accent, meshed with B, 8 teeth, r=18 -->
          <g id="igF" style="transform-origin:130px 130px">
          </g>

          <!-- GEAR G — tiny accent, meshed with C, 8 teeth, r=18 -->
          <g id="igG" style="transform-origin:382px 122px">
          </g>

          <!-- GEAR H — bottom center, meshed with A, 14 teeth, r=32 -->
          <g id="igH" style="transform-origin:250px 355px">
          </g>

          <!-- GEAR I — top center, meshed with A, 12 teeth, r=26 -->
          <g id="igI" style="transform-origin:250px 152px">
          </g>

        </g>
      </svg>
      <!-- ── CLOCK HANDS ──
           Three hand groups rotated by JS every 50 ms to show real time.
           They run counter-clockwise — this is a deliberate mirror clock. -->
      <svg id="hands-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hHourGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4a3018"/>
            <stop offset="35%" stop-color="#e8943a"/>
            <stop offset="65%" stop-color="#c9932a"/>
            <stop offset="100%" stop-color="#5a3a18"/>
          </linearGradient>
          <linearGradient id="hMinGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3a2810"/>
            <stop offset="40%" stop-color="#f0d080"/>
            <stop offset="100%" stop-color="#7a6030"/>
          </linearGradient>
        </defs>

        <!-- Hour hand: short and heavy, shaped like a riveted brass spanner. -->
        <g id="hour-group" style="transform-origin:250px 250px">
