<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethereal — Enter the Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dim: #7a6030;
    --bg: #080706;
    --fog: rgba(201,168,76,0.06);
    --cream: #f5ead8;
    --copper: #b87333;
    --copper-bright: #e8943a;
    --copper-dark: #7a4a1e;
    --rust: #8b3a1a;
    --iron: #2a2520;
    --iron-light: #3d3530;
    --brass: #c9932a;
    --steam: rgba(220,200,160,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      linear-gradient(rgba(8, 7, 6, 0.45), rgba(8, 7, 6, 0.62)),
      url('./ethereal-background-noname.png.png') center center / cover no-repeat fixed;
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(255, 244, 225, 0.06) 0%, rgba(8, 7, 6, 0) 40%),
      linear-gradient(180deg, rgba(18, 18, 16, 0.08) 0%, rgba(8, 7, 6, 0.28) 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── STARS ── */
  #stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute; border-radius: 50%;
    background: white; opacity: 0;
    animation: twinkle var(--d, 3s) var(--delay, 0s) infinite;
  }
  @keyframes twinkle {
    0%,100%{opacity:0} 50%{opacity:var(--op,0.7)}
  }

  /* ── PARTICLES / DUST ── */
  #dust { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .dust {
    position: absolute; border-radius: 50%;
    background: var(--gold-light);
    animation: floatDust var(--fd, 8s) var(--fd-delay, 0s) infinite ease-in-out;
    opacity: 0;
  }
  @keyframes floatDust {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    20%  { opacity: 0.4; }
    80%  { opacity: 0.2; }
    100% { transform: translateY(-80px) translateX(var(--dx, 20px)); opacity: 0; }
  }

  /* ── SCENE ── */
  #scene {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }

  /* ── AMBIENT GLOW ── */
  .ambient {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
  }
  .ambient-center {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.1);opacity:0.7} }

  /* ── CLOCK WRAPPER ── */
  #clock-wrapper {
    position: relative;
    width: 500px; height: 500px;
    cursor: pointer;
    filter: drop-shadow(0 0 40px rgba(184,115,51,0.3)) drop-shadow(0 8px 32px rgba(0,0,0,0.8));
  }

  /* ── STEAM PUFF ANIMATION ── */
  @keyframes steamPuff {
    0%   { opacity:0; transform: scale(0.4) translateY(0); }
    20%  { opacity:0.6; }
    100% { opacity:0; transform: scale(2.2) translateY(-60px); }
  }
  .steam-puff {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220,200,160,0.5) 0%, transparent 70%);
    pointer-events: none;
    animation: steamPuff 2.8s ease-out infinite;
    width: 28px; height: 28px;
  }
  .sp1 { top: 30px; left: 42%; animation-delay: 0s; }
  .sp2 { top: 24px; left: 48%; animation-delay: 0.9s; width:20px; height:20px; }
  .sp3 { top: 28px; left: 54%; animation-delay: 1.7s; width:16px; height:16px; }

  /* ── RIVETED OUTER CASING (gear-outer) ── */
  .gear-ring {
    position: absolute;
    border-radius: 50%;
    animation: rotateCW var(--speed, 20s) linear infinite;
  }

  /* Main toothed gear — mechanical, heavy teeth */
  .gear-outer {
    inset: -46px;
    --speed: 22s;
    background:
      repeating-conic-gradient(
        #7a4a1e 0deg 5.5deg,
        #2a2520 5.5deg 9deg,
        #7a4a1e 9deg 11deg,
        #2a2520 11deg 18deg
      );
    mask: radial-gradient(transparent 81%, black 81.5%, black 90%, transparent 90.5%);
    -webkit-mask: radial-gradient(transparent 81%, black 81.5%, black 90%, transparent 90.5%);
    opacity: 0.9;
  }

  /* Copper band with bolt pattern */
  .gear-mid {
    inset: -18px;
    --speed: 35s;
    animation-direction: reverse;
    background:
      repeating-conic-gradient(
        #b87333 0deg 2deg,
        #7a4a1e 2deg 4deg,
        #b87333 4deg 5deg,
        #7a4a1e 5deg 9deg
      );
    mask: radial-gradient(transparent 87%, black 87.5%, black 93.5%, transparent 94%);
    -webkit-mask: radial-gradient(transparent 87%, black 87.5%, black 93.5%, transparent 94%);
  }

  /* Fine brass inner ring */
  .gear-inner {
    inset: 14px;
    --speed: 55s;
    background:
      repeating-conic-gradient(
        rgba(201,147,42,0.5) 0deg 1.5deg,
        transparent 1.5deg 4.5deg
      );
    mask: radial-gradient(transparent 91%, black 91.5%, black 95.5%, transparent 96%);
    -webkit-mask: radial-gradient(transparent 91%, black 91.5%, black 95.5%, transparent 96%);
  }
  @keyframes rotateCW { to { transform: rotate(360deg); } }

  /* ── CLOCK FACE: IRON & BRASS CASING ── */
  #clock-face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #1c1610 0%, #100e09 45%, #080603 100%);
    border: none;
    box-shadow:
      0 0 0 3px #3d2e14,
      0 0 0 6px #1a1208,
      0 0 0 9px #b87333,
      0 0 0 13px #1a1208,
      0 0 0 16px #7a4a1e,
      0 0 0 20px #0a0806,
      0 0 0 22px rgba(184,115,51,0.4),
      0 0 80px rgba(184,115,51,0.2),
      inset 0 0 100px rgba(0,0,0,0.95),
      inset 0 2px 8px rgba(184,115,51,0.08);
    overflow: visible;
    transition: box-shadow 0.5s;
  }
  #clock-wrapper:hover #clock-face {
    box-shadow:
      0 0 0 3px #5a4520,
      0 0 0 6px #1a1208,
      0 0 0 9px #e8943a,
      0 0 0 13px #1a1208,
      0 0 0 16px #b87333,
      0 0 0 20px #0a0806,
      0 0 0 22px rgba(232,148,58,0.5),
      0 0 120px rgba(184,115,51,0.4),
      inset 0 0 100px rgba(0,0,0,0.95);
  }

  /* SVG face drawn in JS */
  #clock-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  /* Clock hands SVG */
  #hands-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  @keyframes rotateSecond { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes rotateMinute { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes rotateHour   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* ── STEAMPUNK CORNER GEARS ── */
  .small-gear {
    position: absolute;
    animation: rotateCW var(--gs, 6s) linear infinite;
    opacity: 0.75;
  }
  .small-gear svg { width: 100%; height: 100%; }
  .sg1 { width:80px; height:80px; top: 18px; left: 18px; --gs: 10s; }
  .sg2 { width:52px; height:52px; top: 78px; left: 78px; --gs: 6s; animation-direction: reverse; }
  .sg3 { width:80px; height:80px; top: 18px; right: 18px; --gs: 12s; animation-direction: reverse; }
  .sg4 { width:52px; height:52px; top: 78px; right: 78px; --gs: 6s; }
  .sg5 { width:70px; height:70px; bottom: 22px; left: 32px; --gs: 9s; animation-direction: reverse; }
  .sg6 { width:70px; height:70px; bottom: 22px; right: 32px; --gs: 11s; }

  /* ── PIPE CONNECTORS ── */
  .pipe {
    position: absolute;
    background: linear-gradient(var(--pipe-dir, to bottom), #4a3018, #b87333, #7a4a1e);
    border-radius: 3px;
    opacity: 0.7;
  }
  .pipe-top    { top: -12px; left: 50%; transform: translateX(-50%); width: 18px; height: 28px; --pipe-dir: to bottom; }
  .pipe-bottom { bottom: -12px; left: 50%; transform: translateX(-50%); width: 18px; height: 28px; --pipe-dir: to top; }
  .pipe-left   { left: -12px; top: 50%; transform: translateY(-50%); width: 28px; height: 18px; --pipe-dir: to right; }
  .pipe-right  { right: -12px; top: 50%; transform: translateY(-50%); width: 28px; height: 18px; --pipe-dir: to left; }
  .pipe-cap {
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8943a, #7a4a1e);
    border: 2px solid #5a3a18;
    opacity: 0.8;
  }
  .pipe-cap-top    { top: -18px; left: 50%; transform: translateX(-50%); }
  .pipe-cap-bottom { bottom: -18px; left: 50%; transform: translateX(-50%); }
  .pipe-cap-left   { left: -18px; top: 50%; transform: translateY(-50%); }
  .pipe-cap-right  { right: -18px; top: 50%; transform: translateY(-50%); }

  /* ── CLICK HINT ── */
  #hint {
    position: absolute;
    bottom: -60px;
    left: 50%; transform: translateX(-50%);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    text-transform: uppercase;
    animation: hintPulse 2.5s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes hintPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* ── TITLE ── */
  #title {
    position: absolute;
    top: 50px; left: 50%; transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }
  #title h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(28px, 4vw, 52px);
    letter-spacing: 0.4em;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }
  #title p {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    margin-top: 6px;
  }

  /* ── DOOR OPEN ANIMATION ── */
  #clock-face.opening {
    animation: doorOpen 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes doorOpen {
    0%  { transform: perspective(800px) rotateY(0deg); box-shadow: 0 0 0 6px rgba(201,168,76,0.25), 0 0 80px rgba(201,168,76,0.4), inset 0 0 60px rgba(0,0,0,0.8); }
    50% { transform: perspective(800px) rotateY(-40deg); box-shadow: 0 0 60px rgba(201,168,76,0.8), inset 0 0 60px rgba(201,168,76,0.2); }
    100%{ transform: perspective(800px) rotateY(-70deg); box-shadow: 0 0 120px rgba(201,168,76,1); }
  }

  /* ── BIRDS ── */
  .bird {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    animation: birdFly var(--bt, 4s) var(--bd, 0s) cubic-bezier(0.15, 0.8, 0.35, 1) forwards;
    transform-origin: center center;
    filter: drop-shadow(0 4px 18px var(--bird-glow, rgba(8,145,178,0.5)));
  }
  @keyframes birdFly {
    0%   { opacity: 0;   transform: scale(0.05) rotate(var(--br, 0deg)); }
    10%  { opacity: 0.9; transform: scale(1.05) rotate(calc(var(--br,0deg)*0.2)); }
    85%  { opacity: 0.85; }
    100% { opacity: 0;   transform: scale(0.7) translateX(var(--bx,200px)) translateY(var(--by,-300px)) rotate(var(--br2,10deg)); }
  }

  /* ── LIGHT BURST ── */
  #light-burst {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(201,168,76,0.4) 0%, transparent 60%);
    pointer-events: none;
    z-index: 45;
    opacity: 0;
  }
  #light-burst.active {
    animation: burst 1.5s ease-out forwards;
  }
  @keyframes burst {
    0%  { opacity: 0; transform: scale(0.5); }
    30% { opacity: 1; transform: scale(1); }
    100%{ opacity: 0; transform: scale(1.5); }
  }

  /* ── MENU OVERLAY ── */
  #menu-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(10,8,6,0.97) 30%, rgba(6,5,4,0.99) 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  #menu-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* ── MENU CLOCK PORTAL ── */
  #menu-portal {
    position: relative;
    width: 580px;
    text-align: center;
  }

  .portal-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.3);
    animation: rotateCW var(--pr, 20s) linear infinite;
  }
  .portal-ring::before {
    content: '';
    position: absolute; inset: -8px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      rgba(201,168,76,0.2) 0deg 6deg,
      transparent 6deg 14deg
    );
    mask: radial-gradient(transparent 80%, black 80%);
    -webkit-mask: radial-gradient(transparent 80%, black 80%);
  }
  .pr1 { inset: -60px; --pr: 30s; }
  .pr2 { inset: -30px; --pr: 20s; animation-direction: reverse; border-color: rgba(201,168,76,0.5); }

  #menu-circle {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    background: radial-gradient(circle at 40% 35%,
      #1a1408 0%, #0a0806 70%, #050403 100%);
    border-radius: 50%;
    border: 2px solid var(--gold);
    box-shadow:
      0 0 0 6px rgba(201,168,76,0.1),
      0 0 80px rgba(201,168,76,0.3),
      inset 0 0 80px rgba(0,0,0,0.9);
    overflow: visible;
  }

  #menu-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 60px;
    overflow: hidden;
  }

  .menu-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: 0.3em;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .menu-divider {
    width: 60%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 4px 0;
  }

  .menu-item {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 2vw, 20px);
    font-style: italic;
    letter-spacing: 0.15em;
    color: var(--cream);
    cursor: pointer;
    position: relative;
    padding: 4px 20px;
    transition: color 0.3s, transform 0.3s;
    opacity: 0;
    transform: translateY(20px);
    text-decoration: none;
    display: block;
  }
  .menu-item.shown {
    animation: fadeUp 0.5s var(--mi-delay, 0s) ease forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .menu-item::before {
    content: '✦';
    position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    color: var(--gold);
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 10px;
  }
  .menu-item:hover {
    color: var(--gold-light);
    transform: translateX(8px);
  }
  .menu-item:hover::before { opacity: 1; }

  #close-btn {
    position: absolute;
    top: -20px; right: -20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: var(--bg);
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    font-family: 'Cinzel', serif;
    z-index: 110;
  }
  #close-btn:hover {
    background: var(--gold);
    color: var(--bg);
    box-shadow: 0 0 20px var(--gold);
  }

  /* floating birds inside menu */
  .menu-bird {
    position: absolute;
    opacity: 0.55;
    font-size: 14px;
    pointer-events: none;
    animation: menuBirdFloat var(--mb, 8s) ease-in-out infinite alternate;
  }
  @keyframes menuBirdFloat {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); }
    100% { transform: translateX(var(--mx, 30px)) translateY(var(--my, -20px)) rotate(10deg); }
  }

  /* ── SCROLL FEATHERS decorative ── */
  .decor-line {
    position: absolute;
    width: 120px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<!-- Stars -->
<div id="stars"></div>

<!-- Dust particles -->
<div id="dust"></div>

<!-- Light burst on open -->
<div id="light-burst"></div>

<!-- Scene -->
<div id="scene">
  <div class="ambient ambient-center"></div>

  <!-- Title -->
  <div id="title">
    <h1>Æ T H E R E A L</h1>
    <p>where time breathes</p>
  </div>

  <!-- Corner small gears -->
  <div class="small-gear sg1"></div>
  <div class="small-gear sg2"></div>
  <div class="small-gear sg3"></div>
  <div class="small-gear sg4"></div>
  <div class="small-gear sg5"></div>
  <div class="small-gear sg6"></div>

  <!-- Main Clock -->
  <div id="clock-wrapper" onclick="openClock()">
    <div class="gear-ring gear-outer"></div>
    <div class="gear-ring gear-mid"></div>
    <div class="gear-ring gear-inner"></div>

    <!-- Steam puffs from top pipe -->
    <div class="steam-puff sp1"></div>
    <div class="steam-puff sp2"></div>
    <div class="steam-puff sp3"></div>

    <!-- Pipe connectors with end caps -->
    <div class="pipe pipe-top"></div>
    <div class="pipe pipe-bottom"></div>
    <div class="pipe pipe-left"></div>
    <div class="pipe pipe-right"></div>
    <div class="pipe-cap pipe-cap-top"></div>
    <div class="pipe-cap pipe-cap-bottom"></div>
    <div class="pipe-cap pipe-cap-left"></div>
    <div class="pipe-cap pipe-cap-right"></div>

    <div id="clock-face">
      <svg id="clock-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="hands-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hHourGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4a3018"/>
            <stop offset="35%" stop-color="#e8943a"/>
            <stop offset="65%" stop-color="#c9932a"/>
            <stop offset="100%" stop-color="#5a3a18"/>
          </linearGradient>
          <linearGradient id="hMinGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3a2810"/>
            <stop offset="40%" stop-color="#f0d080"/>
            <stop offset="100%" stop-color="#7a6030"/>
          </linearGradient>
        </defs>

        <!-- Hour hand: heavy riveted wrench-style -->
        <g id="hour-group" style="transform-origin:250px 250px">
          <path d="M250,118 L260,175 L258,250 L242,250 L240,175 Z" fill="url(#hHourGrad)"/>
          <path d="M250,112 L262,138 L258,155 L242,155 L238,138 Z" fill="#b87333"/>
          <rect x="243" y="155" width="14" height="4" rx="1" fill="#7a4a1e"/>
          <rect x="244" y="185" width="12" height="3" rx="1" fill="#7a4a1e" opacity="0.6"/>
          <rect x="244" y="210" width="12" height="3" rx="1" fill="#7a4a1e" opacity="0.5"/>
          <!-- rivet hole on hand -->
          <circle cx="250" cy="135" r="3.5" fill="#1a1208"/>
          <circle cx="250" cy="135" r="2" fill="#e8943a" opacity="0.5"/>
        </g>

        <!-- Minute hand: long tapered with hex cutouts -->
        <g id="min-group" style="transform-origin:250px 250px">
          <path d="M250,86 L256,148 L254,250 L246,250 L244,148 Z" fill="url(#hMinGrad)"/>
          <path d="M250,80 L258,108 L254,122 L246,122 L242,108 Z" fill="#c9a84c"/>
          <!-- hex cutout illusion (dark inset) -->
          <polygon points="250,96 255,99 255,105 250,108 245,105 245,99" fill="#1a1208" opacity="0.7"/>
          <polygon points="250,114 254,117 254,121 250,124 246,121 246,117" fill="#1a1208" opacity="0.5"/>
          <rect x="246" y="155" width="8" height="2.5" rx="1" fill="#7a6030" opacity="0.5"/>
          <rect x="246" y="175" width="8" height="2.5" rx="1" fill="#7a6030" opacity="0.4"/>
          <rect x="246" y="195" width="8" height="2.5" rx="1" fill="#7a6030" opacity="0.3"/>
        </g>

        <!-- Second hand: thin red needle with counterweight bob -->
        <g id="sec-group" style="transform-origin:250px 250px">
          <rect x="249.2" y="96" width="1.6" height="160" rx="0.8" fill="#cc3300"/>
          <!-- counterweight -->
          <rect x="247" y="258" width="6" height="22" rx="2" fill="#cc3300" opacity="0.8"/>
          <circle cx="250" cy="280" r="5" fill="#cc3300"/>
        </g>

        <!-- Center hub: multi-layer brass bolt -->
        <circle cx="250" cy="250" r="14" fill="#3d2e14"/>
        <circle cx="250" cy="250" r="11" fill="#b87333"/>
        <circle cx="250" cy="250" r="7"  fill="#1a1208"/>
        <circle cx="250" cy="250" r="4"  fill="#e8943a"/>
        <!-- hex bolt shape on center -->
        <polygon points="250,243 256,246.5 256,253.5 250,257 244,253.5 244,246.5" fill="none" stroke="#7a4a1e" stroke-width="1.5"/>
      </svg>

    <div id="hint">— touch to enter —</div>
  </div>
</div>

<!-- Menu overlay -->
<div id="menu-overlay">
  <div id="menu-portal">
    <div class="portal-ring pr1"></div>

    <div id="menu-circle">

        <!-- floating decorative birds inside -->

        <span class="menu-bird" style="top:65%;right:6%;--mb:9s;--mx:-25px;--my:-20px;font-size:24px;">🦢</span>

<script>
  // ── STARS ──
  const starsEl = document.getElementById('stars');
  for(let i=0; i<120; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2+0.5;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --d:${2+Math.random()*5}s; --delay:${Math.random()*5}s; --op:${0.3+Math.random()*0.7};
    `;
    starsEl.appendChild(s);
  }

  // ── DUST ──
  const dustEl = document.getElementById('dust');
  for(let i=0; i<30; i++){
    const d = document.createElement('div');
    d.className = 'dust';
    const sz = Math.random()*3+1;
    d.style.cssText = `
      width:${sz}px; height:${sz}px;
      bottom:${Math.random()*40}%; left:${20+Math.random()*60}%;
      --fd:${5+Math.random()*8}s; --fd-delay:${Math.random()*8}s;
      --dx:${-30+Math.random()*60}px;
    `;
    dustEl.appendChild(d);
  }

  // ── STEAMPUNK INDUSTRIAL GEAR SVG for corner ornaments ──
  function makeGearSVG(size, teeth, innerR){
    const cx = size/2, cy = size/2;
    const outerR = size/2 - 2;
    const toothDepth = size * 0.12;
    const baseR = outerR - toothDepth;
    // Build gear tooth outline
    let pts = '';
    const totalSteps = teeth * 4;
    for(let i=0; i<totalSteps; i++){
      const frac = i / totalSteps;
      const angle = frac * 2 * Math.PI - Math.PI/2;
      const isOuter = (i % 4 === 1 || i % 4 === 2);
      const r = isOuter ? outerR : baseR;
      pts += `${(cx + r*Math.cos(angle)).toFixed(2)},${(cy + r*Math.sin(angle)).toFixed(2)} `;
    }
    // Rivet bolt holes on the gear body
    let rivets = '';
    const rivetR = (baseR + innerR) / 2;
    const rivetCount = Math.min(teeth, 8);
    for(let i=0; i<rivetCount; i++){
      const a = (i/rivetCount)*2*Math.PI;
      const rx = cx + rivetR*Math.cos(a), ry = cy + rivetR*Math.sin(a);
      rivets += `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="2.2" fill="#1a1208"/>
        <circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="1.2" fill="#e8943a" opacity="0.6"/>`;
    }
    // Spoke cutouts
    let spokes = '';
    const spokeCount = 4;
    for(let i=0; i<spokeCount; i++){
      const a = (i/spokeCount)*2*Math.PI;
      const sx1 = cx + (innerR+4)*Math.cos(a), sy1 = cy + (innerR+4)*Math.sin(a);
      const sx2 = cx + (baseR-4)*Math.cos(a), sy2 = cy + (baseR-4)*Math.sin(a);
      spokes += `<line x1="${sx1.toFixed(1)}" y1="${sy1.toFixed(1)}" x2="${sx2.toFixed(1)}" y2="${sy2.toFixed(1)}"
        stroke="#1a1208" stroke-width="5" stroke-linecap="round"/>
        <line x1="${sx1.toFixed(1)}" y1="${sy1.toFixed(1)}" x2="${sx2.toFixed(1)}" y2="${sy2.toFixed(1)}"
        stroke="#7a4a1e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>`;
    }
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${pts.trim()}" fill="#4a3018" stroke="#b87333" stroke-width="1"/>
      ${spokes}
      ${rivets}
      <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#1a1208" stroke="#b87333" stroke-width="1.5"/>
      <circle cx="${cx}" cy="${cy}" r="${innerR*0.55}" fill="#b87333" opacity="0.8"/>
      <circle cx="${cx}" cy="${cy}" r="${innerR*0.28}" fill="#1a1208"/>
      <circle cx="${cx + innerR*0.15}" cy="${cy - innerR*0.15}" r="${innerR*0.1}" fill="#e8943a" opacity="0.4"/>
    </svg>`;
  }
  document.querySelector('.sg1').innerHTML = makeGearSVG(80, 16, 14);
  document.querySelector('.sg2').innerHTML = makeGearSVG(52, 10, 9);
  document.querySelector('.sg3').innerHTML = makeGearSVG(80, 16, 14);
  document.querySelector('.sg4').innerHTML = makeGearSVG(52, 10, 9);
  document.querySelector('.sg5').innerHTML = makeGearSVG(70, 14, 12);
  document.querySelector('.sg6').innerHTML = makeGearSVG(70, 14, 12);

  // ── STEAMPUNK ART DECO CLOCK FACE SVG ──
  const svg = document.getElementById('clock-svg');
  const cx = 250, cy = 250, R = 248;
  let face = `<defs>
    <radialGradient id="facebg" cx="38%" cy="34%">
      <stop offset="0%"   stop-color="#1c1610"/>
      <stop offset="45%"  stop-color="#100e09"/>
      <stop offset="100%" stop-color="#060503"/>
    </radialGradient>
    <radialGradient id="plateBg" cx="45%" cy="42%">
      <stop offset="0%"   stop-color="#1e1a12"/>
      <stop offset="100%" stop-color="#0e0c08"/>
    </radialGradient>
    <clipPath id="faceClip"><circle cx="250" cy="250" r="247"/></clipPath>
  </defs>`;

  // Base fill
  face += `<circle cx="250" cy="250" r="247" fill="url(#facebg)" clip-path="url(#faceClip)"/>`;

  // ── OUTER RIVET RING — bolts around casing edge ──
  const rivetCount = 32;
  for(let i=0; i<rivetCount; i++){
    const a = (i/rivetCount)*2*Math.PI;
    const rx=(cx+234*Math.cos(a)).toFixed(1), ry=(cy+234*Math.sin(a)).toFixed(1);
    face += `<circle cx="${rx}" cy="${ry}" r="3.5" fill="#1a1208" stroke="#b87333" stroke-width="1" opacity="0.9"/>`;
    face += `<circle cx="${rx}" cy="${ry}" r="1.5" fill="#e8943a" opacity="0.5"/>`;
  }

  // ── CONCENTRIC STEPPED RINGS — Art Deco industrial bezels ──
  const ringDefs = [
    {r:228, sw:1,   col:'#7a4a1e', op:0.9},
    {r:222, sw:3,   col:'#b87333', op:0.7},
    {r:218, sw:1,   col:'#4a3018', op:0.8},
    {r:210, sw:0.8, col:'#7a4a1e', op:0.5},
    // knurled band — tick marks
    {r:205, sw:0.5, col:'#c9932a', op:0.4},
    {r:185, sw:1.5, col:'#b87333', op:0.5},
    {r:180, sw:0.5, col:'#7a4a1e', op:0.4},
    {r:80,  sw:1.5, col:'#b87333', op:0.4},
    {r:74,  sw:0.8, col:'#7a4a1e', op:0.5},
  ];
  ringDefs.forEach(({r,sw,col,op})=>{
    face += `<circle cx="250" cy="250" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" opacity="${op}" clip-path="url(#faceClip)"/>`;
  });

  // ── ENGRAVED RADIAL LINES — machined tool marks ──
  for(let i=0; i<120; i++){
    const a = i*3*Math.PI/180;
    const isMain = i%10===0, isMid = i%5===0;
    const r1 = isMain ? 182 : isMid ? 188 : 193;
    const r2 = 208;
    face += `<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}"
      x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}"
      stroke="${isMain?'#c9932a':'#7a4a1e'}" stroke-width="${isMain?1.5:isMid?0.8:0.4}"
      opacity="${isMain?0.9:isMid?0.6:0.3}" clip-path="url(#faceClip)"/>`;
  }

  // ── INNER PRESSURE GAUGE PLATE — circular brushed metal effect ──
  face += `<circle cx="250" cy="250" r="168" fill="url(#plateBg)" clip-path="url(#faceClip)"/>`;
  // Brushed lines on the plate
  for(let i=0; i<48; i++){
    const a = i*(Math.PI*2/48);
    const pr1=82, pr2=165;
    face += `<line x1="${(cx+pr1*Math.cos(a)).toFixed(1)}" y1="${(cy+pr1*Math.sin(a)).toFixed(1)}"
      x2="${(cx+pr2*Math.cos(a)).toFixed(1)}" y2="${(cy+pr2*Math.sin(a)).toFixed(1)}"
      stroke="#2a2010" stroke-width="1" opacity="0.35" clip-path="url(#faceClip)"/>`;
  }

  // ── HOUR MARKERS — heavy industrial style ──
  for(let i=0;i<12;i++){
    const a=(i/12)*2*Math.PI - Math.PI/2;
    const isQuarter = i%3===0;
    const mr=172;
    if(isQuarter){
      // Large hex-bolt style marker
      const hx=cx+mr*Math.cos(a), hy=cy+mr*Math.sin(a);
      const hexPts = Array.from({length:6},(_,j)=>{
        const ha = j*60*Math.PI/180 + a;
        return `${(hx+9*Math.cos(ha)).toFixed(1)},${(hy+9*Math.sin(ha)).toFixed(1)}`;
      }).join(' ');
      face += `<polygon points="${hexPts}" fill="#b87333" stroke="#7a4a1e" stroke-width="1" opacity="0.95"/>`;
      face += `<polygon points="${Array.from({length:6},(_,j)=>{
        const ha=j*60*Math.PI/180+a;
        return `${(hx+5*Math.cos(ha)).toFixed(1)},${(hy+5*Math.sin(ha)).toFixed(1)}`;
      }).join(' ')}" fill="#1a1208"/>`;
      face += `<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="2" fill="#e8943a" opacity="0.7"/>`;
    } else {
      // Double railroad-tie bars
      const perpA = a+Math.PI/2;
      const mx1=cx+(mr-7)*Math.cos(a), my1=cy+(mr-7)*Math.sin(a);
      const mx2=cx+(mr+7)*Math.cos(a), my2=cy+(mr+7)*Math.sin(a);
      [5,-5].forEach(off=>{
        const ox=Math.cos(perpA)*off, oy=Math.sin(perpA)*off;
        face += `<line x1="${(mx1+ox).toFixed(1)}" y1="${(my1+oy).toFixed(1)}"
          x2="${(mx2+ox).toFixed(1)}" y2="${(my2+oy).toFixed(1)}"
          stroke="#c9932a" stroke-width="1.8" opacity="0.85" stroke-linecap="square"/>`;
      });
      // crossbar connecting the two
      face += `<line x1="${(mx1-Math.cos(perpA)*5).toFixed(1)}" y1="${(my1-Math.sin(perpA)*5).toFixed(1)}"
        x2="${(mx1+Math.cos(perpA)*5).toFixed(1)}" y2="${(my1+Math.sin(perpA)*5).toFixed(1)}"
        stroke="#7a4a1e" stroke-width="1" opacity="0.5" stroke-linecap="square"/>`;
      face += `<line x1="${(mx2-Math.cos(perpA)*5).toFixed(1)}" y1="${(my2-Math.sin(perpA)*5).toFixed(1)}"
        x2="${(mx2+Math.cos(perpA)*5).toFixed(1)}" y2="${(my2+Math.sin(perpA)*5).toFixed(1)}"
        stroke="#7a4a1e" stroke-width="1" opacity="0.5" stroke-linecap="square"/>`;
    }
  }

  // ── MINUTE PIPS — tiny rivet-style dots ──
  for(let i=0;i<60;i++){
    if(i%5===0) continue;
    const a=(i/60)*2*Math.PI - Math.PI/2;
    const mr2=176;
    face += `<circle cx="${(cx+mr2*Math.cos(a)).toFixed(1)}" cy="${(cy+mr2*Math.sin(a)).toFixed(1)}"
      r="1.8" fill="#7a4a1e" opacity="0.65"/>`;
  }

  // ── ROMAN NUMERALS — industrial engraved style ──
  const romans=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
  const nr=140;
  romans.forEach((n,i)=>{
    const a=(i/12)*2*Math.PI - Math.PI/2;
    const nx=(cx+nr*Math.cos(a)).toFixed(1), ny=(cy+nr*Math.sin(a)).toFixed(1);
    // shadow/engraved effect (offset dark copy)
    face += `<text x="${(+nx+0.8).toFixed(1)}" y="${(+ny+0.8).toFixed(1)}" text-anchor="middle" dominant-baseline="central"
      font-family="Cinzel,serif" font-size="13" fill="#1a1208" opacity="0.9">${n}</text>`;
    face += `<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central"
      font-family="Cinzel,serif" font-size="13" fill="#c9932a" opacity="0.95"
      letter-spacing="0.5">${n}</text>`;
  });

  // ── PRESSURE GAUGE ARC — decorative semicircle gauge at bottom of face ──
  const gaugeY = 208, gaugeR = 36, gaugeCX = 250;
  // gauge arc background
  face += `<path d="M${gaugeCX-gaugeR} ${gaugeY} A${gaugeR} ${gaugeR} 0 0 1 ${gaugeCX+gaugeR} ${gaugeY}"
    fill="none" stroke="#4a3018" stroke-width="8" opacity="0.7"/>`;
  // gauge filled arc (decorative — shows "pressure")
  face += `<path d="M${gaugeCX-gaugeR} ${gaugeY} A${gaugeR} ${gaugeR} 0 0 1 ${(gaugeCX+gaugeR*Math.cos(2.2)).toFixed(1)} ${(gaugeY-gaugeR*Math.sin(2.2)).toFixed(1)}"
    fill="none" stroke="#e8943a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>`;
  // gauge tick marks
  for(let t=0;t<=10;t++){
    const ga = Math.PI + (t/10)*Math.PI;
    const gx1=(gaugeCX+gaugeR*Math.cos(ga)).toFixed(1), gy1=(gaugeY+gaugeR*Math.sin(ga)).toFixed(1);
    const gx2=(gaugeCX+(gaugeR-6)*Math.cos(ga)).toFixed(1), gy2=(gaugeY+(gaugeR-6)*Math.sin(ga)).toFixed(1);
    face += `<line x1="${gx1}" y1="${gy1}" x2="${gx2}" y2="${gy2}" stroke="${t%5===0?'#c9932a':'#7a4a1e'}" stroke-width="${t%5===0?1.5:0.8}" opacity="0.8"/>`;
  }
  // gauge needle
  const needleA = Math.PI + 0.65*Math.PI;
  face += `<line x1="${gaugeCX}" y1="${gaugeY}"
    x2="${(gaugeCX+(gaugeR-4)*Math.cos(needleA)).toFixed(1)}" y2="${(gaugeY+(gaugeR-4)*Math.sin(needleA)).toFixed(1)}"
    stroke="#cc3300" stroke-width="1.5" stroke-linecap="round"/>`;
  face += `<circle cx="${gaugeCX}" cy="${gaugeY}" r="3" fill="#b87333"/>`;
  face += `<text x="${gaugeCX}" y="${gaugeY+14}" text-anchor="middle"
    font-family="Cinzel,serif" font-size="7" fill="#7a4a1e" opacity="0.8" letter-spacing="1">PSI</text>`;

  // ── CENTER MEDALLION — industrial cogwheel ──
  // outer cog ring
  const cogPts = Array.from({length:48},(_,i)=>{
    const a=i*(2*Math.PI/48)-Math.PI/2;
    const r = i%4<2 ? 50 : 42;
    return `${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`;
  }).join(' ');
  face += `<polygon points="${cogPts}" fill="#2a2010" stroke="#b87333" stroke-width="0.8" opacity="0.5"/>`;
  face += `<circle cx="${cx}" cy="${cy}" r="40" fill="#0e0c08" stroke="#7a4a1e" stroke-width="0.8" opacity="0.6"/>`;
  // spokes
  for(let i=0;i<6;i++){
    const a=i*60*Math.PI/180;
    face += `<line x1="${(cx+12*Math.cos(a)).toFixed(1)}" y1="${(cy+12*Math.sin(a)).toFixed(1)}"
      x2="${(cx+36*Math.cos(a)).toFixed(1)}" y2="${(cy+36*Math.sin(a)).toFixed(1)}"
      stroke="#7a4a1e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>`;
    face += `<line x1="${(cx+12*Math.cos(a)).toFixed(1)}" y1="${(cy+12*Math.sin(a)).toFixed(1)}"
      x2="${(cx+36*Math.cos(a)).toFixed(1)}" y2="${(cy+36*Math.sin(a)).toFixed(1)}"
      stroke="#b87333" stroke-width="1" stroke-linecap="round" opacity="0.3"/>`;
  }

  svg.innerHTML = face;

  // ── LIVE CLOCK HANDS ──
  function updateHands(){
    const now = new Date();
    const s = now.getSeconds() + now.getMilliseconds()/1000;
    const m = now.getMinutes() + s/60;
    const h = (now.getHours() % 12) + m/60;
    document.getElementById('hour-group').style.transform = `rotate(${h*30}deg)`;
    document.getElementById('min-group').style.transform  = `rotate(${m*6}deg)`;
    document.getElementById('sec-group').style.transform  = `rotate(${s*6}deg)`;
  }
  updateHands();
  setInterval(updateHands, 50);

  // ── OPEN CLOCK ──
  let opened = false;
  function openClock(){
    if(opened) return;
    opened = true;

    const hint = document.getElementById('hint');
    hint.style.opacity = '0';

    // Door swing
    const clockFace = document.getElementById('clock-face');
    clockFace.classList.add('opening');

    // Light burst
    const burst = document.getElementById('light-burst');
    burst.classList.add('active');

    // Release birds
    setTimeout(releaseBirds, 400);

    // Show menu after birds have flown
    setTimeout(showMenu, 1400);
  }

  // ── BIRDS — Detailed Realistic SVG Peacocks & Cranes ──

  // Peacock: full fan tail, iridescent body, detailed feather ocelli
  function makePeacockSVG(){
    const defs = `<defs>
      <radialGradient id="pbody" cx="40%" cy="35%"><stop offset="0%" stop-color="#4dd9c0"/><stop offset="50%" stop-color="#1a6b8a"/><stop offset="100%" stop-color="#0d3d52"/></radialGradient>
      <radialGradient id="pneck" cx="50%" cy="30%"><stop offset="0%" stop-color="#5ee7d0"/><stop offset="100%" stop-color="#0e7490"/></radialGradient>
      <radialGradient id="ptail" cx="50%" cy="100%" r="100%"><stop offset="0%" stop-color="#14532d"/><stop offset="40%" stop-color="#166534"/><stop offset="100%" stop-color="#052e16"/></radialGradient>
      <radialGradient id="focellus" cx="50%" cy="50%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#1d4ed8"/><stop offset="65%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></radialGradient>
      <radialGradient id="foring" cx="50%" cy="50%"><stop offset="0%" stop-color="#86efac"/><stop offset="60%" stop-color="#16a34a"/><stop offset="100%" stop-color="#166534"/></radialGradient>
      <linearGradient id="fshaft" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#bbf7d0"/><stop offset="100%" stop-color="#4ade80"/></linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>`;

    // Build 13 tail feathers in a fan
    let feathers = '';
    for(let f=0; f<13; f++){
      const a = -90 + (f - 6) * 14;
      const rad = a * Math.PI/180;
      const len = 155 + (f===6?20:Math.abs(f-6)<3?10:0);
      const ex = 220 + Math.cos(rad)*len;
      const ey = 240 + Math.sin(rad)*len;
      // shaft
      feathers += `<line x1="220" y1="240" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="url(#fshaft)" stroke-width="1.2" opacity="0.7"/>`;
      // barbs — thin lines branching off shaft
      for(let b=1; b<=6; b++){
        const t = b/7;
        const bx = 220 + Math.cos(rad)*len*t;
        const by = 240 + Math.sin(rad)*len*t;
        const blen = 14*(1-Math.abs(t-0.6));
        const brad = (rad + Math.PI/2);
        feathers += `<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx+Math.cos(brad)*blen).toFixed(1)}" y2="${(by+Math.sin(brad)*blen).toFixed(1)}" stroke="#22c55e" stroke-width="0.7" opacity="0.5"/>`;
        feathers += `<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx-Math.cos(brad)*blen).toFixed(1)}" y2="${(by-Math.sin(brad)*blen).toFixed(1)}" stroke="#22c55e" stroke-width="0.7" opacity="0.5"/>`;
      }
      // ocellus eye at tip
      feathers += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="11" fill="url(#foring)" filter="url(#glow)"/>`;
      feathers += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="7"  fill="url(#focellus)"/>`;
      feathers += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3"  fill="#7dd3fc" opacity="0.9"/>`;
      feathers += `<circle cx="${(ex+1.5).toFixed(1)}" cy="${(ey-1.5).toFixed(1)}" r="1.2" fill="white" opacity="0.7"/>`;
    }

    // Crest
    let crest = '';
    for(let c=0; c<7; c++){
      const cx2 = 222 + (c-3)*4;
      crest += `<line x1="${cx2}" y1="98" x2="${cx2+(c-3)*1.5}" y2="${78-Math.abs(c-3)*3}" stroke="#4ade80" stroke-width="1.2"/>`;
      crest += `<ellipse cx="${cx2+(c-3)*1.5}" cy="${77-Math.abs(c-3)*3}" rx="3" ry="4.5" fill="#38bdf8" opacity="0.95"/>`;
    }

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="340" height="320">
      ${defs}
      ${feathers}
      <!-- wing overlay -->
      <path d="M180 230 Q140 200 120 175 Q150 190 175 210 Q190 220 200 235 Z" fill="#0e7490" opacity="0.7"/>
      <path d="M180 230 Q145 210 130 195 Q155 205 178 222 Z" fill="#22d3ee" opacity="0.4"/>
      <!-- body -->
      <ellipse cx="215" cy="238" rx="48" ry="34" fill="url(#pbody)"/>
      <!-- belly sheen -->
      <ellipse cx="210" cy="245" rx="30" ry="20" fill="#22d3ee" opacity="0.15"/>
      <!-- wing closed -->
      <path d="M215 220 Q255 195 275 180 Q265 210 248 228 Q235 238 218 240 Z" fill="#0c4a6e" opacity="0.85"/>
      <path d="M215 220 Q252 200 268 188 Q260 215 244 230 Z" fill="#0ea5e9" opacity="0.3"/>
      <!-- neck -->
      <path d="M223 208 Q228 175 228 155 Q232 168 232 195 Q232 208 226 215 Z" fill="url(#pneck)"/>
      <!-- neck scale lines -->
      <path d="M225 205 Q229 195 229 185" stroke="#67e8f9" stroke-width="0.8" fill="none" opacity="0.6"/>
      <path d="M225 195 Q230 185 230 175" stroke="#67e8f9" stroke-width="0.8" fill="none" opacity="0.6"/>
      <!-- head -->
      <ellipse cx="228" cy="145" rx="18" ry="16" fill="url(#pneck)"/>
      <!-- face mask -->
      <path d="M236 138 Q248 140 250 145 Q248 150 236 152 Z" fill="#0c4a6e" opacity="0.6"/>
      <!-- eye ring -->
      <circle cx="238" cy="142" r="8" fill="#0c4a6e"/>
      <circle cx="238" cy="142" r="5.5" fill="#e0f2fe"/>
      <circle cx="238" cy="142" r="3.5" fill="#1e293b"/>
      <circle cx="239.5" cy="140.5" r="1.3" fill="white"/>
      <!-- beak upper -->
      <path d="M246 143 Q264 140 268 142 Q264 145 246 147 Z" fill="#d4a017"/>
      <!-- beak lower -->
      <path d="M246 147 Q262 145 265 147 Q260 151 246 149 Z" fill="#b8860b"/>
      <!-- nostril -->
      <ellipse cx="254" cy="143" rx="2" ry="1" fill="#92700a" opacity="0.7"/>
      ${crest}
      <!-- feet/legs -->
      <line x1="205" y1="268" x2="196" y2="296" stroke="#5f6b3a" stroke-width="3.5"/>
      <line x1="225" y1="268" x2="232" y2="296" stroke="#5f6b3a" stroke-width="3.5"/>
      <line x1="196" y1="296" x2="186" y2="305" stroke="#5f6b3a" stroke-width="2.5"/>
      <line x1="196" y1="296" x2="195" y2="308" stroke="#5f6b3a" stroke-width="2.5"/>
      <line x1="196" y1="296" x2="204" y2="306" stroke="#5f6b3a" stroke-width="2.5"/>
    </svg>`;
  }

  // Crane: wingspan, long neck, red crown, black & white plumage
  function makeCraneSVG(){
    const variant = Math.random() > 0.5;
    const wingPrimary   = variant ? '#f8fafc' : '#e2e8f0';
    const wingSecondary = variant ? '#94a3b8' : '#64748b';
    const wingTip       = '#1e293b';
    const bodyColor     = '#f1f5f9';
    const neckColor     = '#f8fafc';
    const crownColor    = '#dc2626';

    const defs2 = `<defs>
      <linearGradient id="cwingL" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="${wingPrimary}"/>
        <stop offset="60%" stop-color="${wingSecondary}"/>
        <stop offset="100%" stop-color="${wingTip}"/>
      </linearGradient>
      <linearGradient id="cwingR" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${wingPrimary}"/>
        <stop offset="60%" stop-color="${wingSecondary}"/>
        <stop offset="100%" stop-color="${wingTip}"/>
      </linearGradient>
      <radialGradient id="cbody" cx="45%" cy="40%">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#cbd5e1"/>
      </radialGradient>
      <filter id="cglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>`;

    // Left wing — large multi-layer
    const lwing = `
      <path d="M195 148 Q145 90 60 80 Q90 115 150 138 Q170 145 192 152 Z" fill="url(#cwingL)" opacity="0.95"/>
      <path d="M193 152 Q148 105 75 100 Q105 128 158 148 Z" fill="${wingSecondary}" opacity="0.55"/>
      <path d="M192 155 Q155 120 95 118 Q118 138 168 154 Z" fill="${wingTip}" opacity="0.3"/>
      <!-- primary feather tips left -->
      <path d="M60 80 Q45 95 50 112 Q65 95 75 88 Z" fill="${wingTip}"/>
      <path d="M72 82 Q57 97 62 113 Q77 97 86 90 Z" fill="${wingTip}" opacity="0.8"/>
      <path d="M84 86 Q70 102 76 118 Q90 102 98 95 Z" fill="${wingTip}" opacity="0.6"/>`;

    // Right wing
    const rwing = `
      <path d="M265 148 Q315 90 400 80 Q370 115 310 138 Q290 145 268 152 Z" fill="url(#cwingR)" opacity="0.95"/>
      <path d="M267 152 Q312 105 385 100 Q355 128 302 148 Z" fill="${wingSecondary}" opacity="0.55"/>
      <path d="M268 155 Q305 120 365 118 Q342 138 292 154 Z" fill="${wingTip}" opacity="0.3"/>
      <path d="M400 80 Q415 95 410 112 Q395 95 385 88 Z" fill="${wingTip}"/>
      <path d="M388 82 Q403 97 398 113 Q383 97 374 90 Z" fill="${wingTip}" opacity="0.8"/>
      <path d="M376 86 Q390 102 384 118 Q370 102 362 95 Z" fill="${wingTip}" opacity="0.6"/>`;

    // Feather texture lines on wings
    let flines = '';
    for(let i=0;i<8;i++){
      const t = 0.2 + i*0.09;
      flines += `<line x1="${(195-t*130).toFixed(0)}" y1="${(148-t*60).toFixed(0)}" x2="${(192-t*110).toFixed(0)}" y2="${(155-t*45).toFixed(0)}" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>`;
      flines += `<line x1="${(265+t*130).toFixed(0)}" y1="${(148-t*60).toFixed(0)}" x2="${(268+t*110).toFixed(0)}" y2="${(155-t*45).toFixed(0)}" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>`;
    }

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="380" height="215">
      ${defs2}
      ${lwing}
      ${rwing}
      ${flines}
      <!-- tail plumes -->
      <path d="M198 178 Q175 195 158 205 Q172 190 192 182 Z" fill="${wingSecondary}" opacity="0.7"/>
      <path d="M196 180 Q178 200 165 212 Q178 195 194 184 Z" fill="${wingTip}" opacity="0.4"/>
      <!-- body -->
      <ellipse cx="230" cy="162" rx="42" ry="26" fill="url(#cbody)"/>
      <!-- body shading -->
      <ellipse cx="235" cy="168" rx="30" ry="18" fill="#94a3b8" opacity="0.2"/>
      <!-- neck — elegant S-curve -->
      <path d="M248 148 Q262 120 268 95 Q272 70 280 52" stroke="${neckColor}" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M248 148 Q262 120 268 95 Q272 70 280 52" stroke="${wingSecondary}" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.4"/>
      <!-- neck black stripe -->
      <path d="M256 130 Q268 108 272 85 Q275 65 282 50" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- head -->
      <ellipse cx="282" cy="44" rx="15" ry="13" fill="${neckColor}"/>
      <!-- black mask through eye -->
      <path d="M270 44 Q278 38 292 40 Q295 44 292 48 Q278 50 270 46 Z" fill="#1e293b"/>
      <!-- red crown patch -->
      <ellipse cx="280" cy="33" rx="9" ry="6" fill="${crownColor}" filter="url(#cglow)"/>
      <!-- eye -->
      <circle cx="288" cy="43" r="4.5" fill="#fef9c3"/>
      <circle cx="288" cy="43" r="2.8" fill="#1c1917"/>
      <circle cx="289" cy="42" r="1"   fill="white"/>
      <!-- beak — long pointed -->
      <path d="M296 42 Q328 40 336 42 Q328 45 296 46 Z" fill="#78716c"/>
      <path d="M296 46 Q326 45 334 47 Q324 50 296 48 Z" fill="#57534e"/>
      <!-- legs trailing behind in flight -->
      <line x1="215" y1="184" x2="188" y2="235" stroke="#64748b" stroke-width="3"/>
      <line x1="245" y1="184" x2="270" y2="238" stroke="#64748b" stroke-width="3"/>
      <!-- toes -->
      <line x1="188" y1="235" x2="175" y2="244" stroke="#64748b" stroke-width="2"/>
      <line x1="188" y1="235" x2="187" y2="248" stroke="#64748b" stroke-width="2"/>
      <line x1="188" y1="235" x2="200" y2="246" stroke="#64748b" stroke-width="2"/>
    </svg>`;
  }

  const BIRD_MAKERS = [makePeacockSVG, makeCraneSVG, makePeacockSVG, makeCraneSVG, makePeacockSVG, makeCraneSVG, makePeacockSVG, makeCraneSVG];

  function releaseBirds(){
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    BIRD_MAKERS.forEach((maker, i) => {
      const bird = document.createElement('div');
      bird.className = 'bird';
      bird.innerHTML = maker();
      const angle = (i / BIRD_MAKERS.length) * 2 * Math.PI - Math.PI/2 + (Math.random()-0.5)*0.5;
      const dist = 420 + Math.random()*200;
      const bx = Math.cos(angle)*dist;
      const by = Math.sin(angle)*dist - 60;
      const br  = (Math.random()-0.5)*20;
      const br2 = (Math.random()-0.5)*30;
      // peacock: teal glow; crane: soft white/silver glow
      const isPeacock = maker === makePeacockSVG;
      bird.style.cssText = `
        left:${cx}px; top:${cy}px;
        --bt:${3.2+Math.random()*1.8}s;
        --bd:${i*0.18}s;
        --bx:${bx}px; --by:${by}px;
        --br:${br}deg; --br2:${br2}deg;
        --bird-glow:${isPeacock ? '#0891b2' : '#e2e8f0'};
        --bird-glow2:${isPeacock ? '#166534' : '#94a3b8'};
        margin-left:-170px; margin-top:-130px;
      `;
      document.body.appendChild(bird);
      setTimeout(()=>bird.remove(), 6000);
    });
  }

  // ── SHOW MENU ──
  function showMenu(){
    const overlay = document.getElementById('menu-overlay');
    overlay.classList.add('visible');
    // stagger menu items
    const items = overlay.querySelectorAll('.menu-item');
    items.forEach((item, i) => {
      item.style.setProperty('--mi-delay', `${0.1 + i*0.1}s`);
      item.classList.add('shown');
    });
  }

  // ── CLOSE MENU ──
  function closeMenu(){
    const overlay = document.getElementById('menu-overlay');
    overlay.classList.remove('visible');

    // reset items
    const items = overlay.querySelectorAll('.menu-item');
    items.forEach(item => {
      item.classList.remove('shown');
      item.style.opacity = '0';
      item.style.transform = 'translateY(20px)';
    });

    // reset clock
    const clockFace = document.getElementById('clock-face');
    clockFace.classList.remove('opening');
    clockFace.style.animation = 'none';
    clockFace.offsetHeight; // reflow

    const burst = document.getElementById('light-burst');
    burst.classList.remove('active');

    document.getElementById('hint').style.opacity = '1';
    opened = false;
  }
</script>
</body>
</html>
